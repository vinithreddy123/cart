<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Responsive Cart Page</title>
    <link rel="stylesheet" href="style.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center">
                <img alt="Logo" class="h-10" src="https://storage.googleapis.com/a1aa/image/JoV0ngHnQkNF64iZhmfKruTnl94ZdR3e_kd8El9HJTc.jpg"/>
                <span class="ml-2 text-xl font-bold">Marmeto</span>
            </div>
            <nav class="flex space-x-6">
                <a class="text-gray-700 hover:text-yellow-500" href="#">Home</a>
                <a class="text-gray-700 hover:text-yellow-500" href="#">Shop</a>
                <a class="text-gray-700 hover:text-yellow-500" href="#">About</a>
                <a class="text-gray-700 hover:text-yellow-500" href="#">Contact</a>
            </nav>
            <div class="flex space-x-4">
                <a class="text-gray-700 hover:text-yellow-500" href="#"><i class="fas fa-search"></i></a>
                <a class="text-gray-700 hover:text-yellow-500" href="#"><i class="fas fa-heart"></i></a>
                <a class="text-gray-700 hover:text-yellow-500" href="#"><i class="fas fa-shopping-cart"></i></a>
            </div>
        </div>
    </header>
    <section class="hero-section">
        <div class="hero-content">
            <h1>Cart</h1>
            <p>Home > Cart</p>
        </div>
    </section>

    <!-- Cart Section -->
    <div class="container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row lg:space-x-8">
            <div class="w-full lg:w-2/3 bg-white p-4 shadow-md rounded-md">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="py-2 px-4">Product</th>
                            <th class="py-2 px-4">Price</th>
                            <th class="py-2 px-4">Quantity</th>
                            <th class="py-2 px-4">Subtotal</th>
                            <th class="py-2 px-4"></th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Cart items will be dynamically added here -->
                    </tbody>
                </table>
            </div>
            <div class="w-full lg:w-1/3 bg-white p-4 shadow-md rounded-md mt-8 lg:mt-0">
                <h2 class="text-xl font-bold mb-4">Cart Totals</h2>
                <div class="flex justify-between mb-2">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹ 0.00</span>
                </div>
                <div class="flex justify-between mb-4">
                    <span>Total</span>
                    <span class="text-yellow-500 font-bold" id="cart-total">₹ 0.00</span>
                </div>
                <button class="w-full bg-yellow-500 text-white py-2 rounded-md">Check Out</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white py-8">
        <div class="container mx-auto px-4 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-4">
                <i class="fas fa-trophy text-yellow-500 text-2xl"></i>
                <div>
                    <h3 class="font-bold">High Quality</h3>
                    <p class="text-gray-600">crafted from top materials</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <i class="fas fa-shield-alt text-yellow-500 text-2xl"></i>
                <div>
                    <h3 class="font-bold">Warranty Protection</h3>
                    <p class="text-gray-600">Over 2 years</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <i class="fas fa-shipping-fast text-yellow-500 text-2xl"></i>
                <div>
                    <h3 class="font-bold">Free Shipping</h3>
                    <p class="text-gray-600">Order over ₹ 150</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <i class="fas fa-headset text-yellow-500 text-2xl"></i>
                <div>
                    <h3 class="font-bold">24 / 7 Support</h3>
                    <p class="text-gray-600">Dedicated support</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
